name: Build

# Required environment setup:
# Variables:
# - JAVA_VERSION: Java version to use (defaults to '25' if not specified)
# - JAVA_DISTRIBUTION: Java distribution to use (defaults to 'zulu' if not specified)
#
# The release stage requires further variables and secrets; see release.yml.

on:
  pull_request:
  push:
    branches:
      - main
      - next

permissions:
  contents: read

# Serialise runs per ref. Releases for a given branch therefore never overlap, which is
# what makes the "version tag is unpublished" check in release.yml race-free. Superseded
# pull request runs are cancelled; release runs never are.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JAVA_VERSION: ${{ vars.JAVA_VERSION || '25' }}
  JAVA_DISTRIBUTION: ${{ vars.JAVA_DISTRIBUTION || 'zulu' }}

jobs:
  lint-java:
    name: Lint Java
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 #v5.6.0
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: "maven"
      - name: Check code formatting with Spotless
        run: mvn com.diffplug.spotless:spotless-maven-plugin:check

  build-test-java:
    name: Build and test Java
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 #v5.6.0
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: "maven"
      - name: Build and test with Maven
        run: mvn -B -U package
      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        if: always()
        with:
          name: test-results
          path: |
            **/target/surefire-reports/

  publish-preview-image:
    # Convenience image for reviewers. It is deliberately not a release artifact: it is
    # not signed, it carries an expiry label, and it never uses a SemVer tag.
    name: Build and push preview image
    runs-on: ubuntu-latest
    needs: [lint-java, build-test-java]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 #v5.6.0
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: "maven"
      - name: Inject slug vars
        uses: rlespinasse/github-slug-action@ef93b2ea4b6405d06fd8684fc3ff795d262ecae8 #v5.7.0
      - name: Build and push preview image
        id: build
        env:
          IMAGE_REPOSITORY: ${{ vars.REGISTRY_HOST }}${{ vars.REGISTRY_REPO }}
          IMAGE_TAG: pr-${{ github.event.pull_request.number }}-${{ env.GITHUB_HEAD_REF_SLUG }}
          REGISTRY_USER: ${{ secrets.ARTIFACTORY_O28M_PUSH_USER }}
          REGISTRY_PASSWORD: ${{ secrets.ARTIFACTORY_O28M_PUSH_TOKEN }}
        run: |
          mvn -B -U package -DskipTests jib:build \
            -Djib.to.image="${IMAGE_REPOSITORY}:${IMAGE_TAG}" \
            -Djib.to.auth.username="${REGISTRY_USER}" \
            -Djib.to.auth.password="${REGISTRY_PASSWORD}" \
            -Djib.container.labels=quay.expires-after=60d
          echo "digest=$(cat target/jib-image.digest)" >> "${GITHUB_OUTPUT}"
      - name: Scan preview image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 #v0.36.0
        env:
          TRIVY_USERNAME: ${{ secrets.ARTIFACTORY_O28M_PUSH_USER }}
          TRIVY_PASSWORD: ${{ secrets.ARTIFACTORY_O28M_PUSH_TOKEN }}
        with:
          image-ref: "${{ vars.REGISTRY_HOST }}${{ vars.REGISTRY_REPO }}@${{ steps.build.outputs.digest }}"
          exit-code: "0"
          vuln-type: os # library findings are handled by ort and github auto submission
          format: table

  release:
    # Only a push to a protected release branch may publish. Pull requests never reach
    # this job, so they never receive release credentials and never publish a release.
    name: Release
    needs: [lint-java, build-test-java]
    if: github.event_name == 'push'
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/release.yml
    with:
      source-sha: ${{ github.sha }}
    secrets: inherit
