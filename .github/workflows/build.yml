name: Build

on:
  pull_request:
    branches: [main, next]
  push:
    branches: [main, next]
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: ${{ vars.JAVA_VERSION || '25' }}
  JAVA_DISTRIBUTION: ${{ vars.JAVA_DISTRIBUTION || 'zulu' }}
  SOURCE_SHA: ${{ github.sha }}

concurrency:
  group: jumper-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint-maven:
    name: Check Java code style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Assert validated commit
        run: test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 #v5.6.0
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Check code formatting with Spotless
        run: ./mvnw -B com.diffplug.spotless:spotless-maven-plugin:check

  build-maven:
    name: Build Maven project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Assert validated commit
        run: test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 #v5.6.0
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Build with Maven
        run: ./mvnw -B package -DskipTests -U

  test-maven:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Assert validated commit
        run: test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 #v5.6.0
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Run tests
        run: ./mvnw -B clean test
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: test-results-${{ github.run_id }}
          path: "**/target/surefire-reports/"

  test-release:
    name: Test release workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f #v6.1.0
        with:
          node-version: "24.15.0"
      - name: Assert validated commit
        run: test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
      - name: Install release test dependencies
        run: npm ci
      - name: Run release tests
        run: npm run test:release

  lint-reuse:
    name: Check REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 #v6.0.0

  dependency-change:
    name: Detect dependency changes
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.dependencies.outputs.changed }}
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 2
          persist-credentials: false
      - name: Detect pom.xml changes
        id: dependencies
        run: |
          if git diff --quiet HEAD^ HEAD -- pom.xml; then
            printf 'changed=false\n' >> "${GITHUB_OUTPUT}"
          else
            printf 'changed=true\n' >> "${GITHUB_OUTPUT}"
          fi

  release-plan:
    name: Calculate release
    if: github.event_name != 'pull_request'
    needs: [lint-maven, build-maven, test-maven, test-release, lint-reuse]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      new-release-published: ${{ steps.semantic-release.outputs.new_release_published }}
      new-release-version: ${{ steps.semantic-release.outputs.new_release_version }}
    steps:
      - name: Checkout validated commit with complete history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Assert validated commit
        run: test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
      - name: Calculate semantic release
        id: semantic-release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 #v6.0.0
        with:
          semantic_version: 25.0.8
          dry_run: true
          extra_plugins: |
            @semantic-release/exec@7.1.0
            semantic-release-export-data@1.2.0
            conventional-changelog-conventionalcommits@9.3.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  qualify-image:
    name: Build, sign, and scan candidate
    if: needs.release-plan.outputs.new-release-published == 'true'
    needs: release-plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE_REPOSITORY: ${{ vars.REGISTRY_HOST }}${{ vars.REGISTRY_REPO }}
      REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
      REGISTRY_USER: ${{ secrets.ARTIFACTORY_O28M_PUSH_USER }}
      REGISTRY_PASSWORD: ${{ secrets.ARTIFACTORY_O28M_PUSH_TOKEN }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Assert validated commit
        run: test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 #v5.6.0
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Install Crane
        run: go install github.com/google/go-containerregistry/cmd/crane@v0.20.6
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 #v4.1.2
        with:
          cosign-release: v2.5.3
      - name: Log in to registry
        run: |
          printf '%s' "${REGISTRY_PASSWORD}" | crane auth login "${REGISTRY_HOST}" \
            --username "${REGISTRY_USER}" --password-stdin
          cosign login -u "${REGISTRY_USER}" -p "${REGISTRY_PASSWORD}" "${REGISTRY_HOST}"
      - name: Resolve existing candidate
        id: candidate
        env:
          RELEASE_VERSION: ${{ needs.release-plan.outputs.new-release-version }}
        run: |
          source_tag="sha-${SOURCE_SHA}"
          promotion=false
          if [[ "${RELEASE_VERSION}" != *-* ]]; then
            if git tag --list "${RELEASE_VERSION}-rc.*" | grep -q .; then
              promotion=true
            fi
            while IFS= read -r rc_tag; do
              rc_sha=$(git rev-list -n 1 "${rc_tag}")
              if git merge-base --is-ancestor "${rc_sha}" "${SOURCE_SHA}" && \
                [[ "$(git rev-parse "${rc_sha}^{tree}")" == "$(git rev-parse "${SOURCE_SHA}^{tree}")" ]] && \
                crane digest "${IMAGE_REPOSITORY}:${rc_tag}" >/dev/null 2>&1; then
                source_tag="${rc_tag}"
                break
              fi
            done < <(git tag --list "${RELEASE_VERSION}-rc.*" --sort=-version:refname)
          fi
          candidate="${IMAGE_REPOSITORY}:${source_tag}"
          digest=$(crane digest "${candidate}" 2>/dev/null || true)
          printf 'reference=%s\n' "${candidate}" >> "${GITHUB_OUTPUT}"
          printf 'digest=%s\n' "${digest}" >> "${GITHUB_OUTPUT}"
          printf 'build=%s\n' "$([[ "${source_tag}" == sha-* && "${promotion}" == false ]] && printf true || printf false)" >> "${GITHUB_OUTPUT}"
      - name: Build and push SHA candidate once
        if: steps.candidate.outputs.digest == '' && steps.candidate.outputs.build == 'true'
        id: build
        run: |
          base_image_arg=()
          if [[ -n "${{ vars.BASE_IMAGE }}" ]]; then
            base_image_arg=(-Djib.from.image="${{ vars.BASE_IMAGE }}")
          fi
          ./mvnw -B jib:build -DskipTests \
            -Djib.to.image="${IMAGE_REPOSITORY}" \
            -Djib.to.tags="sha-${SOURCE_SHA}" \
            -Djib.to.auth.username="${REGISTRY_USER}" \
            -Djib.to.auth.password="${REGISTRY_PASSWORD}" \
            -Djib.container.labels="org.opencontainers.image.revision=${SOURCE_SHA}" \
            "${base_image_arg[@]}"
          printf 'digest=%s\n' "$(<target/jib-image.digest)" >> "${GITHUB_OUTPUT}"
      - name: Select candidate digest
        id: digest
        env:
          EXISTING_DIGEST: ${{ steps.candidate.outputs.digest }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          digest="${EXISTING_DIGEST:-${BUILT_DIGEST}}"
          if [[ -z "${digest}" ]]; then
            printf 'Promotion requires a qualified RC with an identical source tree.\n' >&2
            exit 1
          fi
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          resolved=$(crane digest "${{ steps.candidate.outputs.reference }}")
          [[ "${resolved}" == "${digest}" ]]
          printf 'value=%s\n' "${digest}" >> "${GITHUB_OUTPUT}"
      - name: Check existing qualification evidence
        id: evidence
        env:
          IMAGE: ${{ steps.candidate.outputs.reference }}@${{ steps.digest.outputs.value }}
        run: |
          if cosign verify --insecure-ignore-tlog=true --key env://COSIGN_PUBLIC_KEY "${IMAGE}" >/dev/null 2>&1; then
            printf 'signed=true\n' >> "${GITHUB_OUTPUT}"
          else
            printf 'signed=false\n' >> "${GITHUB_OUTPUT}"
          fi
          if cosign verify-attestation --insecure-ignore-tlog=true --key env://COSIGN_PUBLIC_KEY \
            --type vuln "${IMAGE}" >/dev/null 2>&1; then
            printf 'scanned=true\n' >> "${GITHUB_OUTPUT}"
          else
            printf 'scanned=false\n' >> "${GITHUB_OUTPUT}"
          fi
      - name: Sign candidate digest
        if: steps.evidence.outputs.signed != 'true'
        env:
          IMAGE: ${{ steps.candidate.outputs.reference }}@${{ steps.digest.outputs.value }}
        run: cosign sign --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false "${IMAGE}"
      - name: Scan candidate digest
        if: steps.evidence.outputs.scanned != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 #v0.36.0
        env:
          TRIVY_USERNAME: ${{ secrets.ARTIFACTORY_O28M_PUSH_USER }}
          TRIVY_PASSWORD: ${{ secrets.ARTIFACTORY_O28M_PUSH_TOKEN }}
        with:
          image-ref: ${{ steps.candidate.outputs.reference }}@${{ steps.digest.outputs.value }}
          exit-code: "0"
          vuln-type: os
          format: cosign-vuln
          output: trivy-results.json
      - name: Attest scan result
        if: steps.evidence.outputs.scanned != 'true'
        env:
          IMAGE: ${{ steps.candidate.outputs.reference }}@${{ steps.digest.outputs.value }}
        run: |
          cosign attest --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false \
            --type vuln --predicate trivy-results.json "${IMAGE}"
      - name: Verify candidate evidence
        env:
          IMAGE: ${{ steps.candidate.outputs.reference }}@${{ steps.digest.outputs.value }}
        run: |
          cosign verify --insecure-ignore-tlog=true --key env://COSIGN_PUBLIC_KEY "${IMAGE}" >/dev/null
          cosign verify-attestation --insecure-ignore-tlog=true --key env://COSIGN_PUBLIC_KEY \
            --type vuln "${IMAGE}" >/dev/null

  release:
    name: Publish release
    needs: [release-plan, qualify-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      IMAGE_REPOSITORY: ${{ vars.REGISTRY_HOST }}${{ vars.REGISTRY_REPO }}
      REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
      REGISTRY_USER: ${{ secrets.ARTIFACTORY_O28M_PUSH_USER }}
      REGISTRY_PASSWORD: ${{ secrets.ARTIFACTORY_O28M_PUSH_TOKEN }}
      COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
    steps:
      - name: Checkout validated commit with complete history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true
      - name: Assert validated commit and release branch
        run: |
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test "$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)" = "${SOURCE_SHA}"
      - name: Install Crane
        run: go install github.com/google/go-containerregistry/cmd/crane@v0.20.6
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 #v4.1.2
        with:
          cosign-release: v2.5.3
      - name: Log in to registry
        run: |
          printf '%s' "${REGISTRY_PASSWORD}" | crane auth login "${REGISTRY_HOST}" \
            --username "${REGISTRY_USER}" --password-stdin
          cosign login -u "${REGISTRY_USER}" -p "${REGISTRY_PASSWORD}" "${REGISTRY_HOST}"
      - name: Publish semantic release
        id: semantic-release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 #v6.0.0
        with:
          semantic_version: 25.0.8
          extra_plugins: |
            @semantic-release/exec@7.1.0
            semantic-release-export-data@1.2.0
            conventional-changelog-conventionalcommits@9.3.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trigger-ort:
    name: Trigger ORT for dependency release
    if: needs.dependency-change.outputs.changed == 'true'
    needs: [dependency-change, release-plan, release]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger ORT at the immutable release tag
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #v9.0.0
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ort.yml',
              ref: '${{ needs.release-plan.outputs.new-release-version }}',
              inputs: {
                release_name: '${{ needs.release-plan.outputs.new-release-version }}'
              }
            });
