name: Reconcile Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable SemVer Git tag to reconcile
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: jumper-reconcile-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile existing release
    runs-on: ubuntu-latest
    env:
      IMAGE_REPOSITORY: ${{ vars.REGISTRY_HOST }}${{ vars.REGISTRY_REPO }}
      REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
      REGISTRY_USER: ${{ secrets.ARTIFACTORY_O28M_PUSH_USER }}
      REGISTRY_PASSWORD: ${{ secrets.ARTIFACTORY_O28M_PUSH_TOKEN }}
      COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Validate tag input
        run: '[[ "${{ inputs.tag }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]'
      - name: Checkout existing Git tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          fetch-tags: true
      - name: Verify immutable Git tag
        id: source
        run: |
          sha=$(git rev-list -n 1 "${{ inputs.tag }}")
          remote_sha=$(git ls-remote origin "refs/tags/${{ inputs.tag }}^{}" | cut -f1)
          if [[ -z "${remote_sha}" ]]; then
            remote_sha=$(git ls-remote origin "refs/tags/${{ inputs.tag }}" | cut -f1)
          fi
          [[ "${remote_sha}" == "${sha}" ]]
          printf 'sha=%s\n' "${sha}" >> "${GITHUB_OUTPUT}"
      - name: Install Crane
        run: go install github.com/google/go-containerregistry/cmd/crane@v0.20.6
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 #v4.1.2
        with:
          cosign-release: v2.5.3
      - name: Log in to registry
        run: |
          printf '%s' "${REGISTRY_PASSWORD}" | crane auth login "${REGISTRY_HOST}" \
            --username "${REGISTRY_USER}" --password-stdin
          cosign login -u "${REGISTRY_USER}" -p "${REGISTRY_PASSWORD}" "${REGISTRY_HOST}"
      - name: Reconcile OCI release tag
        run: ./scripts/release-image.sh reconcile "${{ inputs.tag }}" "${{ steps.source.outputs.sha }}"
      - name: Reconcile GitHub release
        run: |
          if ! gh release view "${{ inputs.tag }}" >/dev/null 2>&1; then
            gh release create "${{ inputs.tag }}" --verify-tag --generate-notes \
              --title "${{ inputs.tag }}"
          fi
